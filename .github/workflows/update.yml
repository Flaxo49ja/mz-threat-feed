name: Update Mozambique Threat Feed

on:
  schedule:
    - cron: "0 4 * * *"  # daily 04:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh MZ ASN prefixes (weekly is enough, but cheap to run daily)
        run: python scripts/fetch_prefixes.py

      - name: Fetch IOCs
        env:
          ABUSEIPDB_API_KEY: ${{ secrets.ABUSEIPDB_API_KEY }}
        run: python scripts/fetch_iocs.py

      - name: Cross-reference
        run: python scripts/cross_reference.py

      - name: Generate dashboard
        run: python scripts/generate_dashboard.py

      - name: Fetch news headlines
        run: python scripts/fetch_news.py

      - name: Triage news
        env:
          DIGEST_LLM_API_KEY: ${{ secrets.DIGEST_LLM_API_KEY }}
          DIGEST_LLM_BASE_URL: ${{ vars.DIGEST_LLM_BASE_URL }}
          DIGEST_LLM_MODEL: ${{ vars.DIGEST_LLM_MODEL }}
        run: python scripts/triage_news.py

      - name: Generate digest
        run: python scripts/generate_digest.py

      - name: Commit data + dashboard
        run: |
          git config user.name "mz-threat-feed-bot"
          git config user.email "actions@github.com"
          git add data/ docs/
          git diff --cached --quiet || git commit -m "Auto-update: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
